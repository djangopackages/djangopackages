# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Zensical is not one of Read the Docs' built-in builders, so we build the HTML
# ourselves and copy it into $READTHEDOCS_OUTPUT.
build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    build:
      html:
        - zensical build -f docs/mkdocs.yml --strict
        - mkdir -p $READTHEDOCS_OUTPUT/html
        - cp --recursive docs/site/. $READTHEDOCS_OUTPUT/html

python:
  install:
    - method: uv
      command: sync
      groups:
        - docs
